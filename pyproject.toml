[project]
name = "credit-risk-portfolio-analytics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.27.2",
    "joblib==1.4.2",
    "numpy==2.1.3",
    "openai==1.54.4",
    "pandas==2.2.3",
    "plotly==5.24.1",
    "pyarrow==18.0.0",
    "reportlab==4.2.5",
    "scikit-learn==1.5.2",
    "streamlit==1.40.1",
]

[dependency-groups]
dev = ["pytest==8.3.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
